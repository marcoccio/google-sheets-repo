<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root {
    --tinta: #1c2430;
    --tenue: #64748b;
    --linea: #dfe3e8;
    --fondo: #ffffff;
    --campo: #f6f7f9;
    --acento: #0f6b5c;
    --acento-suave: #e6f2ef;
    --alerta: #b42318;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    color: var(--tinta);
    background: var(--fondo);
    margin: 0;
    padding: 14px 12px 24px;
  }

  .selector {
    display: flex;
    gap: 2px;
    background: var(--campo);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 18px;
  }

  .selector button {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--tenue);
    font: inherit;
    font-weight: 600;
    padding: 8px 4px;
    border-radius: 6px;
    cursor: pointer;
  }

  .selector button.activo {
    background: var(--fondo);
    color: var(--tinta);
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--tenue);
    margin: 0 0 5px;
  }

  .campo { margin-bottom: 13px; }

  input, select {
    width: 100%;
    font: inherit;
    color: var(--tinta);
    background: var(--campo);
    border: 1px solid var(--linea);
    border-radius: 7px;
    padding: 9px 10px;
  }

  input:focus, select:focus {
    outline: 2px solid var(--acento);
    outline-offset: -1px;
    background: var(--fondo);
  }

  #monto, #montoServicio {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -.01em;
  }

  .duo { display: flex; gap: 8px; }
  .duo .campo { flex: 1; margin-bottom: 13px; }

  .guardar {
    width: 100%;
    border: 0;
    background: var(--acento);
    color: #fff;
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 4px;
  }

  .guardar:hover { background: #0b5749; }
  .guardar:disabled { opacity: .5; cursor: default; }

  .aviso {
    margin-top: 14px;
    padding: 10px 11px;
    border-radius: 7px;
    font-size: 12px;
    line-height: 1.45;
    display: none;
  }

  .aviso.ok { display: block; background: var(--acento-suave); color: var(--acento); }
  .aviso.error { display: block; background: #fdecea; color: var(--alerta); }

  .oculto { display: none; }

  .acumulado {
    display: flex;
    gap: 7px;
    margin-bottom: 15px;
  }

  .acumulado div {
    flex: 1;
    background: var(--campo);
    border: 1px solid var(--linea);
    border-radius: 8px;
    padding: 9px 10px;
  }

  .acumulado span {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--tenue);
    margin-bottom: 2px;
  }

  .acumulado strong {
    font-size: 15px;
    font-weight: 600;
  }

  @media (prefers-reduced-motion: no-preference) {
    .guardar { transition: background .15s ease; }
  }
</style>
</head>
<body>

<div class="acumulado">
  <div>
    <span>Marcos</span>
    <strong id="accMarcos">...</strong>
  </div>
  <div>
    <span>Flor</span>
    <strong id="accFlor">...</strong>
  </div>
</div>

<div class="selector">
  <button id="tabGasto" class="activo" onclick="cambiar('gasto')">Gasto diario</button>
  <button id="tabServicio" onclick="cambiar('servicio')">Servicio</button>
</div>

<!-- Gasto diario -->
<div id="formGasto">
  <div class="campo">
    <label for="monto">Monto</label>
    <input type="number" id="monto" placeholder="0" min="0" step="1">
  </div>

  <div class="duo">
    <div class="campo">
      <label for="categoria">Categoria</label>
      <select id="categoria" onchange="cargarDetalles()"></select>
    </div>
    <div class="campo">
      <label for="detalle">Detalle</label>
      <select id="detalle"></select>
    </div>
  </div>

  <div class="campo">
    <label for="descripcion">Descripcion</label>
    <input type="text" id="descripcion" placeholder="Opcional">
  </div>

  <div class="duo">
    <div class="campo">
      <label for="pagadoPor">Pago</label>
      <select id="pagadoPor">
        <option>Marcos</option>
        <option>Flor</option>
      </select>
    </div>
    <div class="campo">
      <label for="division">Se divide</label>
      <select id="division">
        <option>50/50</option>
        <option>Solo Marcos</option>
        <option>Solo Flor</option>
      </select>
    </div>
  </div>

  <div class="campo">
    <label for="fecha">Fecha</label>
    <input type="date" id="fecha">
  </div>

  <button class="guardar" id="btnGasto" onclick="enviarGasto()">Guardar gasto</button>
</div>

<!-- Servicio -->
<div id="formServicio" class="oculto">
  <div class="campo">
    <label for="montoServicio">Monto</label>
    <input type="number" id="montoServicio" placeholder="0" min="0" step="1">
  </div>

  <div class="campo">
    <label for="servicio">Servicio</label>
    <select id="servicio"></select>
  </div>

  <div class="campo">
    <label for="mes">Mes</label>
    <select id="mes"></select>
  </div>

  <button class="guardar" id="btnServicio" onclick="enviarServicio()">Guardar servicio</button>
</div>

<div class="aviso" id="aviso"></div>

<script>
  var OPC = null;

  window.addEventListener('load', function () {
    document.getElementById('fecha').value = new Date().toISOString().slice(0, 10);
    google.script.run.withSuccessHandler(iniciar).obtenerOpciones();
    refrescarAcumulado();
  });

  function refrescarAcumulado() {
    google.script.run
      .withSuccessHandler(function (d) {
        document.getElementById('accMarcos').textContent = d.marcos;
        document.getElementById('accFlor').textContent = d.flor;
      })
      .obtenerAcumulado();
  }

  function iniciar(datos) {
    OPC = datos;
    llenar('categoria', datos.categorias);
    llenar('servicio', datos.servicios);
    llenar('mes', datos.meses);
    cargarDetalles();
    seleccionarMesActual();
  }

  function llenar(id, valores) {
    var sel = document.getElementById(id);
    sel.innerHTML = '';
    valores.forEach(function (v) {
      var o = document.createElement('option');
      o.textContent = v;
      sel.appendChild(o);
    });
  }

  function cargarDetalles() {
    if (!OPC) return;
    var cat = document.getElementById('categoria').value;
    llenar('detalle', OPC.detalles[cat] || []);
  }

  function seleccionarMesActual() {
    var nombres = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                   'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    var actual = nombres[new Date().getMonth()];
    var sel = document.getElementById('mes');
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].textContent === actual) { sel.selectedIndex = i; return; }
    }
  }

  function cambiar(cual) {
    var esGasto = cual === 'gasto';
    document.getElementById('formGasto').classList.toggle('oculto', !esGasto);
    document.getElementById('formServicio').classList.toggle('oculto', esGasto);
    document.getElementById('tabGasto').classList.toggle('activo', esGasto);
    document.getElementById('tabServicio').classList.toggle('activo', !esGasto);
    limpiarAviso();
  }

  function mostrar(texto, tipo) {
    var a = document.getElementById('aviso');
    a.textContent = texto;
    a.className = 'aviso ' + tipo;
  }

  function limpiarAviso() {
    document.getElementById('aviso').className = 'aviso';
  }

  function enviarGasto() {
    var monto = document.getElementById('monto').value;
    if (!monto || Number(monto) <= 0) {
      mostrar('Escribi un monto mayor a cero.', 'error');
      return;
    }

    var btn = document.getElementById('btnGasto');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    google.script.run
      .withSuccessHandler(function (msg) {
        btn.disabled = false;
        btn.textContent = 'Guardar gasto';
        document.getElementById('monto').value = '';
        document.getElementById('descripcion').value = '';
        document.getElementById('monto').focus();
        mostrar(msg, 'ok');
        refrescarAcumulado();
      })
      .withFailureHandler(function (e) {
        btn.disabled = false;
        btn.textContent = 'Guardar gasto';
        mostrar(e.message, 'error');
      })
      .guardarGasto({
        fecha: document.getElementById('fecha').value,
        categoria: document.getElementById('categoria').value,
        detalle: document.getElementById('detalle').value,
        descripcion: document.getElementById('descripcion').value,
        monto: monto,
        pagadoPor: document.getElementById('pagadoPor').value,
        division: document.getElementById('division').value
      });
  }

  function enviarServicio() {
    var monto = document.getElementById('montoServicio').value;
    if (!monto || Number(monto) <= 0) {
      mostrar('Escribi un monto mayor a cero.', 'error');
      return;
    }

    var btn = document.getElementById('btnServicio');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    google.script.run
      .withSuccessHandler(function (msg) {
        btn.disabled = false;
        btn.textContent = 'Guardar servicio';
        document.getElementById('montoServicio').value = '';
        document.getElementById('montoServicio').focus();
        mostrar(msg, 'ok');
        refrescarAcumulado();
      })
      .withFailureHandler(function (e) {
        btn.disabled = false;
        btn.textContent = 'Guardar servicio';
        mostrar(e.message, 'error');
      })
      .guardarServicio({
        servicio: document.getElementById('servicio').value,
        mes: document.getElementById('mes').value,
        monto: monto
      });
  }
</script>

</body>
</html>
